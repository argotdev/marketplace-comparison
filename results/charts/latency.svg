.5" y1="76" x2="632.5" y2="608" stroke="#e1e0d9" stroke-width="1"/><text x="632.5" y="624" fill="#898781" text-anchor="middle" dominant-baseline="middle" style="font-family:system-ui, -apple-system, "Segoe UI", sans-serif;font-size:11px;font-weight:400;font-variant-numeric:tabular-nums;">15.0 ms</text><line x1="780" y1="76" x2="780" y2="608" stroke="#e1e0d9" stroke-width="1"/><text x="780" y="624" fill="#898781" text-anchor="middle" dominant-baseline="middle" style="font-family:system-ui, -apple-system, "Segoe UI", sans-serif;font-size:11px;font-weight:400;font-variant-numeric:tabular-nums;">20.0 ms</text><line x1="190" y1="76" x2="190" y2="608" stroke="#c3c2b7" stroke-width="1"/><text x="178" y="107" fill="#0b0b0b" text-anchor="end" dominant-baseline="middle" style="font-family:system-ui, -apple-system, "Segoe UI", sans-serif;font-size:13px;font-weight:400;">Native (local)</text><path d="M190 86 h337.6099999999999 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-337.6099999999999 z" fill="#2a78d6"/><text x="537.6099999999999" y="96" fill="#52514e" text-anchor="start" dominant-baseline="middle" style="font-family:system-ui, -apple-system, "Segoe UI", sans-serif;font-size:11px;font-weight:400;font-variant-numeric:tabular-nums;">11.6 ms</text><path d="M190 106 h448.53 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-448.53 z" fill="#eb6834"/><text x="648.53" y="116" fill="#52514e" text-anchor="start" dominant-baseline="middle" style="font-family:system-ui, -apple-system, "Segoe UI", sans-serif;font-size:11px;font-weight:400;font-variant-numeric:tabular-nums;">15.3 ms</text><text x="876" y="107" fill="#898781" text-anchor="end" dominant-baseline="middle" style="font-family:system-ui, -apple-system, "Segoe UI", sans-serif;font-size:11px;font-weight:400;font-variant-numeric:tabular-nums;">n=200</text><text x="178" y="165" fill="#0b0b0b" text-anchor="end" dominant-baseline="middle" style="font-family:system-ui, -apple-system, "Segoe UI", sans-serif;font-size:13px;font-weight:400;">Sendbird</text